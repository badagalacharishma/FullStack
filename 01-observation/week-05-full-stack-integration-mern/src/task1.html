<!DOCTYPE html>
<html>
<head><title>Product Bill Calculator</title></head>
<body>
    <h3>Live Bill Calculator</h3>
    <p>Item: <input type="text" id="itemName"></p>
    <p>Amount: <input type="number" id="itemQty" value="1"></p>
    <p>Cost (Rs): <input type="number" id="itemCost" value="0"></p>
    <h4>Final Bill: Rs <span id="finalBill">0</span></h4>
    <script>
        // fetching inputs
        const qtyInput = document.querySelector('#itemQty');
        const costInput = document.querySelector('#itemCost');
        const billOutput = document.querySelector('#finalBill');

        // dynamically calc on input
        const updateBill = () => {
            billOutput.innerHTML = (qtyInput.value * costInput.value).toString();
        };
        qtyInput.addEventListener('input', updateBill);
        costInput.addEventListener('input', updateBill);
    </script>
</body>
</html>
