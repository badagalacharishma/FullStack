<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2eee8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .calculator {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #4b3621;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .quantity {
            display: flex;
            gap: 8px;
        }

        .quantity button {
            width: 45px;
            border: none;
            border-radius: 6px;
            background: #b5651d;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .quantity button:hover {
            background: #8f4f16;
        }

        .quantity input {
            text-align: center;
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            background: #f7f1e8;
            border-radius: 8px;
        }

        .result p {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
        }

        .total {
            border-top: 1px solid #ccc;
            padding-top: 12px;
            font-size: 20px;
            font-weight: bold;
            color: #a34f16;
        }

        #productDisplay {
            text-align: center;
            margin-top: 18px;
            color: #666;
        }

        #error {
            color: red;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h1>Product Calculator</h1>

        <p class="description">
            Calculate the total price instantly
        </p>

        <label for="productName">Product Name</label>
        <input type="text" id="productName" placeholder="Enter product name">

        <label for="price">Price</label>
        <input type="number" id="price" placeholder="Enter price" min="0">

        <label for="quantity">Quantity</label>

        <div class="quantity">
            <button id="decrease">−</button>

            <input type="number" id="quantity" value="1" min="1">

            <button id="increase">+</button>
        </div>

        <div class="result">

            <p>
                <span>Price</span>
                <span id="priceResult">₹0.00</span>
            </p>

            <p>
                <span>Quantity</span>
                <span id="quantityResult">1</span>
            </p>

            <p class="total">
                <span>Total</span>
                <span id="total">₹0.00</span>
            </p>

        </div>

        <div id="productDisplay">
            No product selected
        </div>

        <div id="error"></div>

    </div>

    <script>
        const productName = document.getElementById("productName");
        const price = document.getElementById("price");
        const quantity = document.getElementById("quantity");

        const priceResult = document.getElementById("priceResult");
        const quantityResult = document.getElementById("quantityResult");
        const total = document.getElementById("total");

        const productDisplay = document.getElementById("productDisplay");
        const error = document.getElementById("error");

        const increase = document.getElementById("increase");
        const decrease = document.getElementById("decrease");

        function calculateTotal() {
            let priceValue = Number(price.value);
            let quantityValue = Number(quantity.value);

            if (price.value === "" || priceValue < 0) {
                priceValue = 0;
            }

            if (quantity.value === "" || quantityValue < 1) {
                quantityValue = 1;
                quantity.value = 1;
            }

            let totalPrice = priceValue * quantityValue;

            priceResult.textContent = "₹" + priceValue.toFixed(2);
            quantityResult.textContent = quantityValue;
            total.textContent = "₹" + totalPrice.toFixed(2);

            if (productName.value.trim() !== "") {
                productDisplay.textContent =
                    "You are buying: " + productName.value;
            } else {
                productDisplay.textContent = "No product selected";
            }

            error.textContent = "";
        }

        price.addEventListener("input", calculateTotal);

        quantity.addEventListener("input", calculateTotal);

        productName.addEventListener("input", calculateTotal);

        increase.addEventListener("click", function () {
            quantity.value = Number(quantity.value) + 1;
            calculateTotal();
        });

        decrease.addEventListener("click", function () {
            if (Number(quantity.value) > 1) {
                quantity.value = Number(quantity.value) - 1;
                calculateTotal();
            }
        });

        calculateTotal();
    </script>

</body>
</html>
